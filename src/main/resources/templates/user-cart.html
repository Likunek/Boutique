<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            padding: 80px 20px 40px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(107, 140, 92, 0.08) 0%, rgba(107, 140, 92, 0.02) 90%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-nav {
            position: fixed;
            top: 40px;
            left: 50px;
            z-index: 1000;
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #4a5b3c;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            border: 1px solid #adb5bd;
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: #8aaE7a;
            color: white;
            border-color: #8aaE7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(138, 174, 122, 0.3);
        }

        .logout-container {
            position: fixed;
            top: 40px;
            right: 50px;
            z-index: 1000;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #dc3545;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid #dc3545;
            box-shadow: 0 6px 14px rgba(220, 53, 69, 0.15);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
        }

        .cart-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .cart-header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cart-summary {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .total-label {
            font-size: 18px;
            font-weight: 500;
            color: #495057;
        }

        .total-price {
            font-size: 32px;
            font-weight: 800;
            color: #8aaE7a;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cart-item {
            background: white;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            transition: all 0.2s;
        }

        .cart-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #d4e0d0;
        }

        .item-checkbox {
            flex-shrink: 0;
        }

        .item-checkbox input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #8aaE7a;
        }

        .item-image {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e9ecef, #dee2e6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #adb5bd;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e2f;
            margin-bottom: 4px;
        }

        .item-seller {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .item-price {
            font-size: 22px;
            font-weight: 700;
            color: #8aaE7a;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: white;
            color: #495057;
            border: 1px solid #dee2e6;
            text-decoration: none;
        }

        .btn-primary {
            background: #8aaE7a;
            border-color: #8aaE7a;
            color: white;
            box-shadow: 0 4px 10px rgba(138,174,122,0.3);
        }

        .btn-primary:hover {
            background: #6b8c5c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(107,140,92,0.3);
        }

        .btn-danger {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #b02a37;
            transform: translateY(-2px);
        }

        .btn-checkout-large {
            background: #8aaE7a;
            border-color: #8aaE7a;
            color: white;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(138,174,122,0.4);
        }

        .btn-checkout-large:hover {
            background: #6b8c5c;
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(107,140,92,0.5);
        }

        .checkout-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 32px;
            color: #6c757d;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .cart-item { flex-wrap: wrap; }
            .item-image { width: 60px; height: 60px; font-size: 28px; }
            .item-name { font-size: 16px; }
            .item-price { font-size: 18px; }
            .action-buttons { justify-content: center; }
            .btn-checkout-large { padding: 12px 32px; font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="back-nav">
  <a href="/welcome">← Back to Home</a>
</div>
<div class="logout-container">
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="btn-logout">🚪 Logout</button>
  </form>
</div>

<div class="container">
  <div class="cart-header">
    <h1>🛒 My Shopping Cart</h1>
  </div>

  <div th:if="${cart != null and not #lists.isEmpty(cart.itemCards)}">
    <div class="cart-summary">
      <div>
        <span class="total-label">Total price:</span>
        <span class="total-price" th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)} + ' ₽'">0 ₽</span>
      </div>
    </div>

    <form th:action="@{/user/cart/card}" method="post" id="deleteForm">
      <div class="cart-items">
        <div th:each="card : ${cart.itemCards}" class="cart-item">
          <div class="item-checkbox">
            <input type="checkbox" name="cards" th:value="${card.id}">
          </div>
          <div class="item-image">📦</div>
          <div class="item-details">
            <div class="item-name" th:text="${card.name}">Product name</div>
            <div class="item-seller" th:text="'Seller: ' + ${card.seller}">Seller</div>
            <div class="item-price" th:text="${#numbers.formatDecimal(card.price, 1, 2)} + ' ₽'">0 ₽</div>
          </div>
        </div>
      </div>
      <div class="action-buttons">
        <button type="submit" form="deleteForm" class="btn btn-danger" onclick="return confirm('Delete selected items?')">
          🗑️ Delete selected
        </button>
      </div>
    </form>

    <div class="checkout-wrapper">
      <form th:action="@{/user/order/{cartId}(cartId=${cart.id})}" method="get">
        <button type="submit" class="btn btn-checkout-large">✅ Checkout all items</button>
      </form>
    </div>
  </div>

  <div th:if="${cart == null or #lists.isEmpty(cart.itemCards)}" class="empty-cart">
    🛍️ Your cart is empty. <a th:href="@{/item-card(role='ROLE_USER')}" style="color: #8aaE7a;">Continue shopping</a>
  </div>
</div>
</body>
</html>
