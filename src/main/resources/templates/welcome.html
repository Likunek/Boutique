<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Boutique</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .welcome-title {
            font-size: 100px;
            font-weight: 700;
            margin: 300px auto 0 auto;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            letter-spacing: 2px;
            animation: fadeIn 0.8s ease-out;
        }

        .view-items-btn {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 300px auto 0 auto;
            padding: 20px 40px;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 8px 20px rgba(107, 140, 92, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .view-items-btn:hover {
            background: linear-gradient(135deg, #8aaE7a 0%, #6b8c5c 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(107, 140, 92, 0.5);
        }

        .my-account-btn {
            position: fixed;
            bottom: 70px;
            right: 50px;
            padding: 20px 24px;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 2px 10px rgba(107, 140, 92, 0.3);
            cursor: pointer;
            border: none;
            text-align: center;
            min-width: 180px;
            z-index: 100;
        }

        .my-account-btn:hover {
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(107, 140, 92, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .welcome-title {
                font-size: 48px;
            }
            .view-items-btn {
                max-width: 90%;
                font-size: 18px;
                padding: 16px 30px;
                margin-top: 30px;
            }
            .my-account-btn {
                bottom: 20px;
                right: 20px;
                padding: 8px 16px;
                font-size: 14px;
                min-width: 140px;
            }
        }

        @media (max-width: 480px) {
            .welcome-title {
                font-size: 36px;
            }
            .view-items-btn {
                font-size: 16px;
                padding: 14px 24px;
            }
            .my-account-btn {
                bottom: 15px;
                right: 15px;
                padding: 6px 12px;
                font-size: 12px;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
<div class="welcome-title">
  Welcome to Boutique
</div>
<a href="/item-card" class="view-items-btn">
  🛍️ View items
</a>
<a th:href="@{'/' + ${userRole} + '/profile/'+ ${userId}}" class="my-account-btn">
  My account
</a>
</body>
</html>
