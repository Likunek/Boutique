<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доступ запрещен - Boutique</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .error-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: shake 0.5s ease-out;
        }

        .error-title {
            font-size: 32px;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 16px;
        }

        .error-subtitle {
            font-size: 18px;
            color: #6b8c5c;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .error-message {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
            padding: 20px;
            background: #fef2f2;
            border-radius: 12px;
            border-left: 4px solid #ef4444;
            text-align: left;
        }

        .error-message p {
            margin: 8px 0;
        }

        .buttons-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 140, 92, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .logout-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
        }

        .logout-btn button {
            background: rgba(107, 140, 92, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
        }

        .logout-btn button:hover {
            background: #6b8c5c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 140, 92, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .error-card {
                padding: 30px 20px;
            }

            .error-title {
                font-size: 24px;
            }

            .logout-btn {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>
<div class="error-card">
  <div class="error-icon">🔒</div>
  <h1 class="error-title">Access is denied</h1>
  <div class="error-subtitle">403 Forbidden</div>

  <div class="error-message">
    <p>⛔ You don't have enough rights to access this page.</p>
  </div>

  <div class="buttons-group">
    <a href="/welcome" class="btn-primary">
      To the main
    </a>
    <a href="/login?logout" class="btn-secondary">
      🔄 Log in with a different account
    </a>
  </div>
</div>

<div class="logout-btn">
  <form th:action="@{/logout}" method="post">
    <button type="submit">
      <span>Exit</span>
    </button>
  </form>
</div>
</body>
</html>
