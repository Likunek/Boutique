<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Items</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            padding: 80px 20px 40px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(107, 140, 92, 0.08) 0%, rgba(107, 140, 92, 0.02) 90%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        .back-nav {
            position: fixed;
            top: 40px;
            left: 50px;
            z-index: 1000;
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #4a5b3c;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            border: 1px solid #adb5bd;
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: #8aaE7a;
            color: white;
            border-color: #8aaE7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(138, 174, 122, 0.3);
        }

        .logout-container {
            position: fixed;
            top: 40px;
            right: 50px;
            z-index: 1000;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #dc3545;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid #dc3545;
            box-shadow: 0 6px 14px rgba(220, 53, 69, 0.15);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
        }

        .table-wrapper {
            background: white;
            border-radius: 32px;
            padding: 20px;
            border: 1px solid #e9ecef;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8f9fa;
            color: #2c3e2f;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            color: #495057;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .verify-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .verify-true {
            background: #d4e0d0;
            color: #2c5a2e;
        }

        .verify-false {
            background: #ffe0b5;
            color: #cc7a00;
        }

        .item-link {
            color: #4a5b3c;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .item-link:hover {
            color: #8aaE7a;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            th, td {
                padding: 8px;
                font-size: 12px;
            }
            .table-wrapper {
                padding: 12px;
            }
            .back-nav, .logout-container {
                top: 20px;
            }
            .back-nav {
                left: 20px;
            }
            .logout-container {
                right: 20px;
            }
        }
    </style>
</head>
<body>
<div class="back-nav">
  <a href="/admin/profile/1">← Back to Admin</a>
</div>

<div class="logout-container">
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="btn-logout">🚪 Logout</button>
  </form>
</div>

<div class="container">
  <h1 class="page-title">📦 All Items</h1>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Cost price</th>
        <th>Weight (kg)</th>
        <th>Square (m²)</th>
        <th>Verified</th>
        <th>Seller</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${items}">
        <td th:text="${item.id}"></td>
        <td>
          <a th:href="@{/seller/items/{id}(id=${item.id})}" class="item-link" th:text="${item.name}"></a>
        </td>
        <td th:text="${item.costPrice} + ' ₽'">0 ₽</td>
        <td th:text="${item.weight != null ? item.weight + ' kg' : '-'}">- kg</td>
        <td th:text="${item.square != null ? item.square + ' m²' : '-'}">- m²</td>
        <td>
          <span th:class="${item.verify ? 'verify-badge verify-true' : 'verify-badge verify-false'}">
            <span th:text="${item.verify ? 'Yes' : 'No'}">-</span>
          </span>
        </td>
        <td>
          <span th:if="${item.seller != null}" th:text="${item.seller.name}"></span>
          <span th:unless="${item.seller != null}">—</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
