<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .error-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .error-code {
            background: #f8f9fa;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e2f;
            margin-bottom: 20px;
        }
        .error-details {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #8aaE7a;
            border: 1px solid #8aaE7a;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 500;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            background: #6b8c5c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">⚠️</div>
  <div class="error-code" th:text="${errorCode}"></div>
  <div class="error-message" th:text="${errorMessage}"></div>
  <div class="error-details" th:text="${errorDetails}"></div>
  <a href="/welcome" class="btn">🏠 Back to Home</a>
</div>
</body>
</html>
