<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Seller - ' + ${seller.name}">Seller profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            padding: 80px 20px 40px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(107, 140, 92, 0.08) 0%, rgba(107, 140, 92, 0.02) 90%);
            pointer-events: none;
            z-index: 0;
        }

        .back-nav {
            position: fixed;
            top: 40px;
            left: 50px;
            z-index: 1000;
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #4a5b3c;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            border: 1px solid #adb5bd;
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: #8aaE7a;
            color: white;
            border-color: #8aaE7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(138, 174, 122, 0.3);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        .logout-container {
      position: fixed;
      top: 40px;
      right: 50px;
      z-index: 1000;
    }
        .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 10px 22px;
      border-radius: 60px;
      color: #dc3545;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      border: 1px solid #dc3545;
      box-shadow: 0 6px 14px rgba(220, 53, 69, 0.15);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: #dc3545;
      color: white;
      border-color: #dc3545;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
    }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card {
            background: white;
            border-radius: 32px;
            border: 2px solid #8aaE7a;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 48px;
            backdrop-filter: blur(4px);
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .card-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .card-body {
            padding: 30px;
        }

        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
            align-items: center;
        }

        .info-icon {
            width: 40px;
            font-size: 24px;
        }

        .info-label {
            width: 100px;
            font-weight: 600;
            color: #495057;
        }

        .info-value {
            flex: 1;
            color: #2c3e2f;
            font-weight: 500;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            border: 1px solid #adb5bd;
            border-radius: 60px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: #4a5b3c;
            transition: all 0.2s;
            margin-top: 20px;
        }

        .btn-secondary:hover {
            background: #8aaE7a;
            color: white;
            border-color: #8aaE7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(138, 174, 122, 0.3);
        }

        @media (max-width: 600px) {
            .back-nav {
                top: 20px;
                left: 20px;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            .info-label {
                width: auto;
            }
        }

    </style>
</head>
<body>
<div class="back-nav">
    <a th:href="@{/item-card (role=${role})}">← Back to Cards</a>
</div>
<div class="logout-container">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">🚪 Logout</button>
    </form>
</div>
<div class="container">
    <div class="profile-card">
        <div class="card-header">
            <div class="avatar">
                <span th:text="${seller.name != null ? seller.name.substring(0,1) : '?'}">👤</span>
            </div>
            <h1 th:text="${seller.name}">Seller Name</h1>
            <div>Seller profile</div>
        </div>
        <div class="card-body">
            <div class="info-row">
                <div class="info-icon">📧</div>
                <div class="info-label">Email</div>
                <div class="info-value" th:text="${seller.email != null ? seller.email : 'not specified'}">
                </div>
            </div>
            <div style="text-align: center;">
                <a th:href="@{/item-card/by-seller/{id}(id=${seller.id})}" class="btn-secondary">🛍️ View items</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
