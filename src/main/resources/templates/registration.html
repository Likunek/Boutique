<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(45deg);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        .header p {
            opacity: 0.95;
            font-size: 15px;
            position: relative;
            z-index: 1;
        }

        .form-container {
            padding: 40px 30px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fee2e2;
            color: #dc2626;
            border-left: 4px solid #dc2626;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group label .optional {
            font-weight: normal;
            font-size: 12px;
            color: #8aaE7a;
            margin-left: 5px;
        }

        .form-group label .required {
            color: #dc2626;
            margin-left: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8aaE7a;
            box-shadow: 0 0 0 3px rgba(138, 174, 122, 0.1);
        }

        .form-group input::placeholder {
            color: #adb5bd;
        }

        .role-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .role-buttons input[type="radio"] {
            display: none;
        }

        .role-buttons .role-btn {
            display: inline-block;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #495057;
            text-align: center;
            flex: 1;
            min-width: 100px;
        }

        .role-buttons .role-btn:hover {
            background: #e9ecef;
            border-color: #8aaE7a;
            transform: translateY(-1px);
        }

        .role-buttons input[type="radio"]:checked + .role-btn {
            background: #8aaE7a;
            border-color: #6b8c5c;
            color: white;
            box-shadow: 0 4px 10px rgba(107, 140, 92, 0.3);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #8aaE7a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-register:hover {
            background: #6b8c5c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 140, 92, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
            font-size: 14px;
            color: #6c757d;
        }

        .login-link a {
            color: #8aaE7a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #6b8c5c;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
            }
            .header {
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 24px;
            }
        }

    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Create Account</h1>
        <p>Join us and start your journey</p>
    </div>

    <div class="form-container">
        <div th:if="${message}" class="message" th:text="${message}">
            User exists
        </div>

        <form th:action="@{/registration}" method="post">
            <div class="form-group">
                <label for="number">
                    📞 Phone Number <span class="required">*</span>
                </label>
                <input type="tel"
                       id="number"
                       name="number"
                       placeholder="Enter your phone number"
                       required>
            </div>

            <div class="form-group">
                <label for="password">
                    🔒 Password <span class="required">*</span>
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <div class="form-group">
                <label for="name">
                    👤 Username <span class="required">*</span>
                </label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your username"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="email">
                    ✉️ Email <span class="optional">(optional)</span>
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="user@example.com">
            </div>

            <div class="form-group">
                <label>Account Type <span class="required">*</span></label>
                <div class="role-buttons">
                    <input type="radio" name="role" id="roleUser" value="USER" required>
                    <label for="roleUser" class="role-btn">👤 USER</label>

                    <input type="radio" name="role" id="roleSeller" value="SELLER" required>
                    <label for="roleSeller" class="role-btn">🏪 SELLER</label>
                </div>
            </div>

            <button type="submit" class="btn-register">
                Register Now
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a th:href="@{/login}">Sign in here</a>
        </div>
    </div>
</div>
</body>
</html>
