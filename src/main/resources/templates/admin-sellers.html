<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Users</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to top, #ff9f7c 0%, #ffe5d9 50%, #ffffff 100%);
            min-height: 100vh;
            padding: 80px 20px 40px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 10% 20%, rgba(107, 140, 92, 0.08) 0%, rgba(107, 140, 92, 0.02) 90%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6b8c5c 0%, #8aaE7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .back-nav {
            position: fixed;
            top: 40px;
            left: 50px;
            z-index: 1000;
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #4a5b3c;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
            border: 1px solid #adb5bd;
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            background: #8aaE7a;
            color: white;
            border-color: #8aaE7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(138, 174, 122, 0.3);
        }

        .logout-container {
            position: fixed;
            top: 40px;
            right: 50px;
            z-index: 1000;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            color: #dc3545;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid #dc3545;
            box-shadow: 0 6px 14px rgba(220, 53, 69, 0.15);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
        }

        .table-wrapper {
            background: white;
            border-radius: 32px;
            padding: 20px;
            border: 2px solid #ffe5d9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8f9fa;
            color: #2c3e2f;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            color: #495057;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .btn-danger {
            background: #dc3545;
            border: 1px solid #dc3545;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background: #b02a37;
            border-color: #b02a37;
            transform: scale(1.05);
        }

        .actions-col {
            width: 1px;
            white-space: nowrap;
            padding-right: 50px;
        }
        .seller-link {
            color: #2c3e2f;
            text-decoration: none;
            font-weight: 500;
        }
        .seller-link:hover {
            color: #8aaE7a;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            th, td {
                padding: 8px;
                font-size: 12px;
            }
            .table-wrapper {
                padding: 12px;
            }
            .back-nav, .logout-container {
                top: 20px;
            }
            .back-nav {
                left: 20px;
            }
            .logout-container {
                right: 20px;
            }
        }
    </style>
</head>
<body>
<div class="back-nav">
  <a href="/admin/profile/1">← Back to Admin</a>
</div>

<div class="logout-container">
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="btn-logout">🚪 Logout</button>
  </form>
</div>

<div class="container">
  <h1 class="page-title">👥 All Sellers</h1>

  <div class="table-wrapper">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Number</th>
        <th>Email</th>
        <th class="actions-col"></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="seller : ${sellers}">
        <td th:text="${seller.id}"></td>
        <td>
          <a th:href="@{/public-seller/{id}(id=${seller.id})}" class="seller-link" th:text="${seller.name}">Seller Name</a>
        </td>
        <td th:text="${seller.number}"></td>
        <td>
          <span th:if="${seller.email != null}" th:text="${seller.email}"></span>
          <span th:unless="${seller.email != null}">—</span>
        </td>
        <td class="actions-col">
          <form th:action="@{/sellers/{id}(id=${seller.id})}" method="post"
                onsubmit="return confirm('Are you sure you want to delete user ' + this.querySelector('[name=userName]').value + '?');">
            <input type="hidden" name="_method" value="delete"/>
            <input type="hidden" name="userName" th:value="${seller.name}"/>
            <button type="submit" class="btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
